#
# Unit tests on CPU, without mmcv-full / mmdet (they need a compiled build, see rocm/install_rocm.sh): the tests
# that need them are skipped with the reason printed by pytest -rs.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.23.5 scipy==1.9.3 scikit-image==0.21.0 opencv-python-headless==4.11.0.86 pytest
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: python -m pytest tests tools/equivalence/tests
