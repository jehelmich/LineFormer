[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lineformer"
version = "0.3.0"
description = "LineFormer line chart data extraction (Lal et al., ICDAR 2023), runnable on CPU, CUDA and ROCm GPUs"
readme = "README.md"
requires-python = ">=3.8"
# No licence field: the upstream code has no licence from its authors; see the README section "Licensing".
# torch (from its own index), the vendored mmcv subset (third_party/mmcv) and the vendored mmdetection are installed
# separately (rocm/install_rocm.sh): a plain `pip install` of this package does not give a working environment.
dependencies = ["numpy", "opencv-python", "scipy", "scikit-image", "bresenham"]

[project.urls]
Upstream = "https://github.com/TheJaeLal/LineFormer"
Paper = "https://link.springer.com/chapter/10.1007/978-3-031-41734-4_24"

[project.scripts]
lineformer = "lineformer_cli:main"
lineformer-client = "lineformer_client:main"

[tool.setuptools]
py-modules = ["infer", "line_utils", "clean_chart", "msda_compat", "kept_queries", "lineformer_cli", "scale_compat",
              "tiling", "lineformer_engine", "lineformer_jobs", "lineformer_serve", "lineformer_client"]

[tool.ruff]
# Lint only the files this fork added (they carry the SPDX Apache-2.0 header). Upstream LineFormer files,
# lineformer_swin_t_config.py (upstream), the vendored mmdetection/ and third_party/mmcv/ are neither linted nor
# reformatted. Run `ruff check` from the repository root.
include = ["kept_queries.py", "msda_compat.py", "scale_compat.py", "tiling.py", "lineformer_cli.py",
           "lineformer_client.py", "lineformer_engine.py", "lineformer_jobs.py", "lineformer_serve.py",
           "tests/**/*.py", "tools/benchmark.py", "tools/equivalence/**/*.py"]
extend-exclude = ["mmdetection", "third_party"]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/equivalence/tests"]
addopts = "-rs"
